<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --azul: #1a73e8;
        --azul-oscuro: #1557b0;
        --gris-texto: #202124;
        --gris-suave: #5f6368;
        --borde: #e0e0e0;
        --fondo-app: #eef2f6;
        --burbuja-bot: #ffffff;
        --rojo: #d93025;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--fondo-app);
        color: var(--gris-texto);
        display: flex;
        justify-content: center;
        padding: 24px 12px;
      }

      .chat-card {
        width: 100%;
        max-width: 680px;
        height: min(760px, 92vh);
        background: #ffffff;
        border-radius: 16px;
        border: 1px solid var(--borde);
        box-shadow: 0 4px 16px rgba(32, 33, 36, 0.08);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 20px;
        border-bottom: 1px solid var(--borde);
        flex-shrink: 0;
      }

      .avatar-bot {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--azul);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 19px;
        flex-shrink: 0;
      }

      .chat-header h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }

      .estado-linea {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--gris-suave);
        margin-top: 2px;
      }

      .punto-activo {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34a853;
        flex-shrink: 0;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .estado-vacio {
        margin: auto 0;
        text-align: center;
        color: var(--gris-suave);
      }

      .estado-vacio .icono-grande {
        font-size: 36px;
        margin-bottom: 10px;
      }

      .estado-vacio p {
        font-size: 13px;
        margin: 0 0 16px;
      }

      .chips {
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
      }

      .chip {
        background: var(--fondo-app);
        border: 1px solid var(--borde);
        border-radius: 18px;
        padding: 9px 16px;
        font-size: 13px;
        color: var(--gris-texto);
        cursor: pointer;
        text-align: left;
        max-width: 420px;
        transition: background 0.15s, border-color 0.15s;
      }

      .chip:hover {
        background: #e8f0fe;
        border-color: var(--azul);
      }

      .fila-mensaje {
        display: flex;
        gap: 10px;
        max-width: 88%;
        animation: aparecer 0.2s ease-out;
      }

      @keyframes aparecer {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fila-usuario {
        align-self: flex-end;
        flex-direction: row-reverse;
      }

      .fila-bot {
        align-self: flex-start;
      }

      .avatar-mini {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        flex-shrink: 0;
      }

      .avatar-mini.bot {
        background: var(--azul);
      }

      .avatar-mini.usuario {
        background: #5f6368;
      }

      .burbuja {
        padding: 11px 14px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .fila-usuario .burbuja {
        background: var(--azul);
        color: #ffffff;
        border-bottom-right-radius: 4px;
      }

      .fila-bot .burbuja {
        background: var(--burbuja-bot);
        border: 1px solid var(--borde);
        border-bottom-left-radius: 4px;
      }

      .fila-bot .burbuja.error {
        border-color: var(--rojo);
        background: #fdecea;
        color: var(--rojo);
      }

      .burbuja strong {
        font-weight: 600;
      }

      .acciones-burbuja {
        display: flex;
        justify-content: flex-start;
        margin-top: 6px;
      }

      .btn-copiar {
        border: none;
        background: none;
        color: var(--gris-suave);
        font-size: 11px;
        cursor: pointer;
        padding: 2px 4px;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .btn-copiar:hover {
        color: var(--azul);
      }

      .puntos-escribiendo {
        display: flex;
        gap: 3px;
        padding: 4px 0;
      }

      .puntos-escribiendo span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gris-suave);
        animation: rebotar 1.1s infinite ease-in-out;
      }

      .puntos-escribiendo span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .puntos-escribiendo span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes rebotar {
        0%, 60%, 100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        30% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      .chat-input-area {
        border-top: 1px solid var(--borde);
        padding: 12px 16px;
        flex-shrink: 0;
      }

      .chat-input-row {
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }

      textarea {
        flex: 1;
        resize: none;
        border: 1px solid var(--borde);
        border-radius: 20px;
        padding: 10px 16px;
        font-family: inherit;
        font-size: 14px;
        line-height: 1.4;
        max-height: 120px;
        transition: border-color 0.15s, box-shadow 0.15s;
      }

      textarea:focus {
        outline: none;
        border-color: var(--azul);
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
      }

      .btn-enviar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: var(--azul);
        color: #ffffff;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        flex-shrink: 0;
        transition: background 0.15s;
      }

      .btn-enviar:hover:not(:disabled) {
        background: var(--azul-oscuro);
      }

      .btn-enviar:disabled {
        background: #c1c1c1;
        cursor: not-allowed;
      }

      .pista-envio {
        font-size: 11px;
        color: var(--gris-suave);
        text-align: right;
        margin-top: 4px;
        padding-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="chat-card">
      <div class="chat-header">
        <div class="avatar-bot">🤖</div>
        <div>
          <h1>Asistente RPA TestFire</h1>
          <div class="estado-linea">
            <span class="punto-activo"></span>
            <span>Conectado</span>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="mensajes">
        <div class="estado-vacio" id="estadoVacio">
          <div class="icono-grande">🛠️</div>
          <p>Describe un error del RPA o elige un ejemplo:</p>
          <div class="chips">
            <div class="chip" onclick="usarEjemplo(this)">El login falló con "Login Failed" después de 3 intentos</div>
            <div class="chip" onclick="usarEjemplo(this)">Firefox no inicia y no se genera captura de pantalla</div>
            <div class="chip" onclick="usarEjemplo(this)">La conciliación marca movimientos como no encontrados</div>
          </div>
        </div>
      </div>

      <div class="chat-input-area">
        <div class="chat-input-row">
          <textarea id="pregunta" rows="1" placeholder="Describe el error o el paso donde ocurrió..."></textarea>
          <button class="btn-enviar" id="btnEnviar" onclick="enviarPregunta()">➤</button>
        </div>
        <div class="pista-envio">⌘/Ctrl + Enter para enviar</div>
      </div>
    </div>

    <script>
      const mensajesDiv = document.getElementById('mensajes');
      const estadoVacio = document.getElementById('estadoVacio');
      const textarea = document.getElementById('pregunta');
      const btnEnviar = document.getElementById('btnEnviar');

      let enviando = false;
      let contadorId = 0;

      textarea.addEventListener('input', function () {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
      });

      textarea.addEventListener('keydown', function (evento) {
        if ((evento.metaKey || evento.ctrlKey) && evento.key === 'Enter') {
          enviarPregunta();
        }
      });

      function usarEjemplo(elemento) {
        textarea.value = elemento.textContent;
        enviarPregunta();
      }

      function escaparHtml(texto) {
        const div = document.createElement('div');
        div.textContent = texto;
        return div.innerHTML;
      }

      function formatearRespuesta(texto) {
        return escaparHtml(texto).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      }

      function desplazarAbajo() {
        mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
      }

      function agregarMensajeUsuario(texto) {
        const fila = document.createElement('div');
        fila.className = 'fila-mensaje fila-usuario';
        fila.innerHTML =
          '<div class="avatar-mini usuario">🧑</div>' +
          '<div class="burbuja">' + escaparHtml(texto) + '</div>';
        mensajesDiv.appendChild(fila);
        desplazarAbajo();
      }

      function agregarBurbujaBotCargando() {
        contadorId += 1;
        const idFila = 'bot-msg-' + contadorId;

        const fila = document.createElement('div');
        fila.className = 'fila-mensaje fila-bot';
        fila.id = idFila;
        fila.innerHTML =
          '<div class="avatar-mini bot">🤖</div>' +
          '<div>' +
            '<div class="burbuja">' +
              '<div class="puntos-escribiendo"><span></span><span></span><span></span></div>' +
            '</div>' +
          '</div>';
        mensajesDiv.appendChild(fila);
        desplazarAbajo();
        return idFila;
      }

      function resolverBurbujaBot(idFila, texto, esError) {
        const fila = document.getElementById(idFila);
        if (!fila) return;

        const burbuja = fila.querySelector('.burbuja');
        burbuja.classList.toggle('error', !!esError);
        burbuja.innerHTML = formatearRespuesta(texto);

        if (!esError) {
          const acciones = document.createElement('div');
          acciones.className = 'acciones-burbuja';
          acciones.innerHTML = '<button class="btn-copiar" onclick="copiarTexto(this)">📋 Copiar</button>';
          acciones.querySelector('button').dataset.texto = texto;
          fila.querySelector('div:nth-child(2)').appendChild(acciones);
        }

        desplazarAbajo();
      }

      function copiarTexto(boton) {
        const texto = boton.dataset.texto;
        navigator.clipboard.writeText(texto).then(function () {
          const original = boton.textContent;
          boton.textContent = '✓ Copiado';
          setTimeout(function () {
            boton.textContent = original;
          }, 1500);
        });
      }

      function enviarPregunta() {
        if (enviando) return;

        const pregunta = textarea.value.trim();
        if (!pregunta) {
          textarea.focus();
          return;
        }

        if (estadoVacio.parentNode) {
          estadoVacio.remove();
        }

        agregarMensajeUsuario(pregunta);
        const idFila = agregarBurbujaBotCargando();

        textarea.value = '';
        textarea.style.height = 'auto';
        enviando = true;
        btnEnviar.disabled = true;

        google.script.run
          .withSuccessHandler(function (respuesta) {
            resolverBurbujaBot(idFila, respuesta, false);
            enviando = false;
            btnEnviar.disabled = false;
            textarea.focus();
          })
          .withFailureHandler(function (error) {
            resolverBurbujaBot(idFila, 'Ocurrió un error inesperado: ' + error.message, true);
            enviando = false;
            btnEnviar.disabled = false;
          })
          .consultarBot(pregunta);
      }
    </script>
  </body>
</html>
